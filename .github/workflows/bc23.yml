name: BC23 foundation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc23-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Build pinned runtime and execute readiness checks
        run: nix flake check -L
      - name: Record immutable tested identity
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          cp flake.lock seasons/2023/manifest.json evidence/
          nix path-info --json .#bcenv > evidence/store-path.json
          nix build .#checks.x86_64-linux.fixture-game --out-link fixture-evidence
          cp -rL fixture-evidence evidence/fixtures
          # Evaluate only: never rebuild/re-run qualification to collect evidence.
          qualification="$(nix eval --raw .#checks.x86_64-linux.replay-query.outPath)"
          diagnostic="$(nix eval --raw .#checks.x86_64-linux.diagnostic-replay-query.outPath)"
          test ! -e "$diagnostic/cooperative-qualification"
          cp "$qualification/qualification-selection.json" evidence/active-selection.json
          cp "$diagnostic/qualification-selection.json" evidence/diagnostic-selection.json
          cp "$qualification/cooperative-qualification/evidence.json" evidence/cooperative-qualification.json
          export QUALIFICATION_PR_HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          python3 tools/record_qualification_identity.py evidence
      - name: Retain release identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bc23-foundation-evidence
          path: evidence/
          if-no-files-found: warn
