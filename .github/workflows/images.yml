name: NixOS images
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Enable KVM for VM tests
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Evaluate all outputs and run fixture and VM tests
        run: nix flake check -L
      - name: Check Nix formatting
        run: nix fmt -- --check flake.nix nix/
      - name: Existing prompt enforcement tests
        run: npm ci && npm test
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: [supervisor, competitor]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Build GCE disk image
        run: nix build -L '.#${{ matrix.role }}-gce'
      - name: Boot the produced GCE disk
        run: nix run .#image-test -- ./result '${{ matrix.role }}'
      - name: Record image identity
        run: |
          mkdir -p evidence
          cp 'boot-${{ matrix.role }}.log' evidence/
          cp flake.lock evidence/
          nix path-info --json ./result > evidence/store-path.json
          sha256sum result/*.raw.tar.gz > evidence/SHA256SUMS
          git rev-parse HEAD > evidence/revision.txt
      - name: Publish boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-evidence-${{ matrix.role }}
          path: |
            evidence/
            boot-*.log
          if-no-files-found: warn
